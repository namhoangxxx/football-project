name: Sync Match Details & Events

on:
  schedule:
    # Chạy tự động vào lúc 01:00 UTC (08:00 sáng giờ Việt Nam) hàng ngày
    # (Thời điểm API-Football đã reset daily quota 100 req/ngày)
    - cron: '0 1 * * *'
  # Cho phép bấm nút chạy thủ công trên GitHub UI bất cứ lúc nào
  workflow_dispatch:

jobs:
  sync-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase

      - name: Run Match Sync Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python sync_match_details.py